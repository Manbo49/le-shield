<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101c2c">
  <meta name="description" content="LE SHIELD — Savoir et Habileté Informatique en Libre Diffusion. Des vidéos pour progresser en numérique.">
  <meta property="og:title" content="LE SHIELD">
  <meta property="og:description" content="Savoir et Habileté Informatique en Libre Diffusion.">
  <meta property="og:image" content="assets/logo-shield-carre.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/app-icon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" sizes="180x180">
  <link rel="stylesheet" href="styles.css?v=44">
  <title>LE SHIELD — Vidéos numériques</title>
</head>
<body>
  <div class="circuit-background" aria-hidden="true"></div>
  <div class="circuit-glow" aria-hidden="true"></div>
  <div class="app-shell">
    <header class="topbar">
      <a class="home-return" id="home-return" href="#accueil" aria-label="Retour à l’accueil" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7M5.5 9v11h13V9M9 20v-6h6v6"/></svg>
        <span>Accueil</span>
      </a>
    </header>
    <main id="app" tabindex="-1">
      <section class="hero" id="accueil">
        <button class="hero-logo-button" id="hero-logo-button" type="button" aria-label="Faire scintiller le logo Le Shield">
          <img class="hero-banner" src="assets/bandeau-shield.png" alt="">
          <span class="hero-circuit-glow" aria-hidden="true"></span>
          <span class="hero-letter-laser" aria-hidden="true"></span>
          <span class="hero-star-trails" aria-hidden="true">
            <svg viewBox="0 0 2000 1125" preserveAspectRatio="xMidYMid meet" focusable="false">
              <defs>
                <filter id="star-trail-bloom" x="-30%" y="-80%" width="160%" height="260%" color-interpolation-filters="sRGB">
                  <feGaussianBlur stdDeviation="5" result="blur" />
                  <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
                </filter>
                <radialGradient id="star-flare-gradient">
                  <stop offset="0" stop-color="#f5fdff" stop-opacity=".68" />
                  <stop offset=".2" stop-color="#c8f0ff" stop-opacity=".42" />
                  <stop offset="1" stop-color="#7ac9ed" stop-opacity="0" />
                </radialGradient>
                <linearGradient id="star-trail-gradient" gradientUnits="userSpaceOnUse" x1="680" y1="655" x2="1310" y2="543">
                  <stop offset="0" stop-color="#b7e7f6" stop-opacity=".18" />
                  <stop offset=".68" stop-color="#d2f2fc" stop-opacity=".38" />
                  <stop offset="1" stop-color="#f5fdff" stop-opacity=".86" />
                </linearGradient>
              </defs>
              <g class="star-trail star-trail-one">
                <path class="star-trail-glow" d="M 728 589 C 690 614 668 640 700 656 C 757 683 929 628 1051 574 C 1146 533 1196 500 1236 479" />
                <path class="star-trail-core" d="M 728 589 C 690 614 668 640 700 656 C 757 683 929 628 1051 574 C 1146 533 1196 500 1236 479" />
              </g>
              <g class="star-trail star-trail-two">
                <path class="star-trail-glow" d="M 711 602 C 674 626 668 652 706 669 C 795 708 986 663 1138 604 C 1214 575 1270 551 1307 543" />
                <path class="star-trail-core" d="M 711 602 C 674 626 668 652 706 669 C 795 708 986 663 1138 604 C 1214 575 1270 551 1307 543" />
              </g>
              <g class="star-trail star-trail-three">
                <path class="star-trail-glow" d="M 697 617 C 665 645 672 671 720 687 C 818 721 991 713 1118 679 C 1167 666 1203 655 1233 650" />
                <path class="star-trail-core" d="M 697 617 C 665 645 672 671 720 687 C 818 721 991 713 1118 679 C 1167 666 1203 655 1233 650" />
              </g>
              <g class="star-flare star-flare-one" transform="translate(1236 479)">
                <circle class="star-flare-halo" r="32" />
                <path class="star-flare-core" d="M0-18 4.5-5.8 17-5.5 7 2.5 10.5 15 0 7.5-10.5 15-7 2.5-17-5.5-4.5-5.8Z" />
              </g>
              <g class="star-flare star-flare-two" transform="translate(1307 543)">
                <circle class="star-flare-halo" r="34" />
                <path class="star-flare-core" d="M0-19 4.7-6 18-5.8 7 2.8 10.8 16 0 8-10.8 16-7 2.8-18-5.8-4.7-6Z" />
              </g>
              <g class="star-flare star-flare-three" transform="translate(1233 650)">
                <circle class="star-flare-halo" r="33" />
                <path class="star-flare-core" d="M0-18 4.5-5.8 17-5.5 7 2.5 10.5 15 0 7.5-10.5 15-7 2.5-17-5.5-4.5-5.8Z" />
              </g>
            </svg>
          </span>
        </button>
        <h1 class="sr-only">LE SHIELD</h1>
      </section>

      <section class="search-section" aria-label="Recherche">
        <label class="search-box" for="search-input">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 5 5"></path></svg>
          <input id="search-input" type="search" placeholder="Recherche dans les catégories et les vidéos" autocomplete="off">
          <kbd>/</kbd>
        </label>
      </section>

      <nav class="breadcrumbs" id="breadcrumbs" aria-label="Fil d’Ariane"></nav>
      <section id="view" aria-live="polite"></section>
      <div id="search-results" hidden></div>
    </main>
    <dialog class="video-dialog" id="video-dialog" aria-labelledby="video-dialog-title">
      <div class="video-dialog-panel">
        <header class="video-dialog-header">
          <div>
            <p class="video-dialog-kicker">LECTURE VIDÉO</p>
            <h2 id="video-dialog-title">Vidéo</h2>
          </div>
          <button class="video-dialog-close" id="video-dialog-close" type="button" aria-label="Fermer la vidéo">✕</button>
        </header>
        <div class="video-frame-wrap">
          <iframe id="video-frame" title="Lecteur vidéo YouTube" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
      </div>
    </dialog>
    <footer><span class="footer-name">LE SHIELD</span><span class="footer-acronym">SAVOIR ET HABILETÉ INFORMATIQUE EN LIBRE DIFFUSION</span><a class="footer-logo-link" href="#accueil" aria-label="Revenir en haut de la page"><img class="footer-mark" src="assets/logo-simple.png" alt="" width="34" height="34"></a></footer>
  </div>
  <noscript>Cette application a besoin de JavaScript pour afficher les vidéos.</noscript>
  <script src="app.js?v=37" defer></script>
</body>
</html>
